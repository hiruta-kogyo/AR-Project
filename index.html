<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* 説明ポップアップ */
#infoBox {
  position: fixed;
  bottom: 20px;
  left: 10px;
  right: 10px;
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 15px;
  border-radius: 10px;
  display: none;
  font-size: 16px;
}
</style>

</head>

<body>

<!-- 説明UI -->
<div id="infoBox"></div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- ===== 部品1 ===== -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane class="clickable" color="blue" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('モーター：回転力を生み出す主要部品')">
    </a-plane>
    <a-text value="モーター" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品2 ===== -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-plane class="clickable" color="green" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('バッテリー：電力を供給する装置')">
    </a-plane>
    <a-text value="バッテリー" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品3 ===== -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-plane class="clickable" color="red" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('ギア：回転を伝達する機構')">
    </a-plane>
    <a-text value="ギア" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品4 ===== -->
  <a-entity mindar-image-target="targetIndex: 3">
    <a-plane class="clickable" color="purple" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('シャフト：回転軸となる部品')">
    </a-plane>
    <a-text value="シャフト" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品5 ===== -->
  <a-entity mindar-image-target="targetIndex: 4">
    <a-plane class="clickable" color="orange" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('タイヤ：車を移動させる部品')">
    </a-plane>
    <a-text value="タイヤ" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品6 ===== -->
  <a-entity mindar-image-target="targetIndex: 5">
    <a-plane class="clickable" color="cyan" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('サスペンション：衝撃を吸収する機構')">
    </a-plane>
    <a-text value="サスペンション" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品7 ===== -->
  <a-entity mindar-image-target="targetIndex: 6">
    <a-plane class="clickable" color="yellow" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('フレーム：構造を支える骨組み')">
    </a-plane>
    <a-text value="フレーム" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品8 ===== -->
  <a-entity mindar-image-target="targetIndex: 7">
    <a-plane class="clickable" color="pink" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('ブレーキ：速度を制御する装置')">
    </a-plane>
    <a-text value="ブレーキ" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品9 ===== -->
  <a-entity mindar-image-target="targetIndex: 8">
    <a-plane class="clickable" color="brown" width="1.2" height="0.5"
      position="0 0 0"
      onclick="showInfo('ステアリング：方向を制御')">
    </a-plane>
    <a-text value="ステアリング" align="center" position="0 0 0.1"></a-text>
  </a-entity>

  <!-- ===== 部品10以降（省略形式） ===== -->
  <!-- 必要なら同じパターンで追加 -->

</a-scene>

<script>
function showInfo(text){
  const box = document.getElementById("infoBox");
  box.innerText = text;
  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 3000);
}
</script>

</body>
</html>
